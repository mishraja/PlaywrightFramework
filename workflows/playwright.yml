name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Run Playwright tests
      run: npm run test:regression
      env:
        CI: true
        # Secrets injected from GitHub Repository Secrets
        SWAG_PASSWORD: ${{ secrets.SWAG_PASSWORD }}
        SWAG_USERNAME: ${{ secrets.SWAG_USERNAME }}

    - name: Generate Allure Report
      if: always()
      run: |
        # Find the latest run folder
        LATEST_RUN=$(ls -td allure-results/run-* | head -1)
        echo "Generating report from $LATEST_RUN"
        npx allure generate "$LATEST_RUN" -o allure-report --clean

    - name: Upload Playwright Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

    - name: Upload Allure Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allure-report
        path: allure-report/
        retention-days: 30
